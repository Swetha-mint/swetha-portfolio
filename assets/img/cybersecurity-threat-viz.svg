<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Cybersecurity threat analysis visualization</title><desc id="desc">Stylized dashboard with cybersecurity incident charts for 2015 to 2024.</desc><rect width="1200" height="750" fill="#fcfcfa"/><rect x="45" y="40" width="1110" height="670" rx="8" fill="#fff" stroke="#000" stroke-width="4"/><text x="80" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#000">Global Cybersecurity Threat Analysis</text><text x="80" y="135" font-family="Arial,sans-serif" font-size="20" fill="#666">Python • Pandas • Matplotlib • CSV • 2015–2024</text><g stroke="#e6e6e0" stroke-width="2"><line x1="90" y1="600" x2="555" y2="600"/><line x1="90" y1="510" x2="555" y2="510"/><line x1="90" y1="420" x2="555" y2="420"/><line x1="90" y1="330" x2="555" y2="330"/><line x1="90" y1="240" x2="555" y2="240"/><line x1="90" y1="600" x2="90" y2="210"/></g><polyline points="100,550 145,520 190,535 235,450 280,470 325,390 370,410 415,325 460,350 505,260 550,290" fill="none" stroke="#ff5b00" stroke-width="8"/><text x="95" y="640" font-family="Arial,sans-serif" font-size="20" fill="#000">Threat trend by year</text><g stroke="#000" stroke-width="3"><line x1="650" y1="600" x2="1100" y2="600"/><line x1="650" y1="600" x2="650" y2="220"/></g><g fill="#ff5b00"><rect x="690" y="470" width="55" height="130"/><rect x="765" y="410" width="55" height="190"/><rect x="840" y="350" width="55" height="250"/><rect x="915" y="290" width="55" height="310"/><rect x="990" y="250" width="55" height="350"/></g><text x="650" y="640" font-family="Arial,sans-serif" font-size="20" fill="#000">Incident / loss distribution</text><rect x="80" y="670" width="1040" height="1" fill="#d8d8d2"/></svg>